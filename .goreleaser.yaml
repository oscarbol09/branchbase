# .goreleaser.yaml for BranchBase
version: 2

project_name: branchbase

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: branchbase
    main: ./cmd/branchbase
    binary: branchbase
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - branchbase.example.yaml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

brews:
  - name: branchbase
    repository:
      owner: oscarbol09
      name: homebrew-branchbase
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/oscarbol09/branchbase"
    description: "Zero-config, Git-native local database branching for PostgreSQL, MySQL, and SQLite."
    license: "MIT"
    install: |
      bin.install "branchbase"
    test: |
      system "#{bin}/branchbase version"
