site_name: BranchBase 🌿
site_description: Zero-config, Git-native local database branching for PostgreSQL, MySQL, and SQLite.
site_author: oscarbol09
site_url: https://oscarbol09.github.io/branchbase/
repo_url: https://github.com/oscarbol09/branchbase
repo_name: oscarbol09/branchbase

theme:
  name: material
  language: en
  palette:
    # Dark Mode default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light Mode toggle
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Framework Guides:
      - Prisma ORM: guides/prisma.md
      - Docker Compose: guides/docker-compose.md
  - Architecture & Design:
      - System Architecture: architecture.md
  - Contributing:
      - Contributor Guide: contributing.md
      - Code of Conduct: code-of-conduct.md
      - Security Policy: security.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md
