<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="40%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="spTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6edf3" />
    </linearGradient>
    <linearGradient id="spGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="spGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#spBg)" />
  <rect width="1276" height="636" x="2" y="2" fill="none" stroke="#30363d" stroke-width="2" />

  <!-- Background Grid Accent -->
  <g stroke="#21262d" stroke-width="1" opacity="0.3">
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
  </g>

  <!-- Left Side: Large Branded Emblem Card -->
  <g transform="translate(100, 140)">
    <rect width="360" height="360" rx="48" fill="#161b22" stroke="#30363d" stroke-width="3" filter="url(#spGlow)" />
    
    <!-- Database Graphic -->
    <g transform="translate(80, 80)">
      <path d="M0,110 C0,96 45,85 100,85 C155,85 200,96 200,110 L200,140 C200,154 155,165 100,165 C45,165 0,154 0,140 Z" fill="#21262d" stroke="#58a6ff" stroke-width="4" />
      <ellipse cx="100" cy="110" rx="100" ry="25" fill="#30363d" stroke="#58a6ff" stroke-width="4" />

      <path d="M0,55 C0,41 45,30 100,30 C155,30 200,41 200,55 L200,85 C200,99 155,110 100,110 C45,110 0,99 0,85 Z" fill="#21262d" stroke="#58a6ff" stroke-width="4" />
      <ellipse cx="100" cy="55" rx="100" ry="25" fill="#30363d" stroke="#58a6ff" stroke-width="4" />

      <path d="M0,0 C0,-14 45,-25 100,-25 C155,-25 200,-14 200,0 L200,30 C200,44 155,55 100,55 C45,55 0,44 0,30 Z" fill="#21262d" stroke="#58a6ff" stroke-width="4" />
      <ellipse cx="100" cy="0" rx="100" ry="25" fill="#1f6feb" fill-opacity="0.4" stroke="#58a6ff" stroke-width="4" />

      <!-- Branch curve to the right -->
      <path d="M100,120 C160,120 210,80 210,30" fill="none" stroke="#3fb950" stroke-width="6" stroke-linecap="round" />
      <circle cx="210" cy="30" r="12" fill="#3fb950" stroke="#161b22" stroke-width="3" />
      <path d="M210,20 C230,-5 250,10 240,25 C230,35 210,35 210,20 Z" fill="url(#spGreenGrad)" />
    </g>
  </g>

  <!-- Right Side: Content and Titles -->
  <g transform="translate(520, 160)">
    <!-- Pill Badge -->
    <rect width="210" height="34" rx="17" fill="#1f6feb" fill-opacity="0.15" stroke="#388bfd" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#3fb950" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#58a6ff" letter-spacing="1">OPEN-SOURCE TOOL</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#spTextGrad)" letter-spacing="-1.5">
      BranchBase <tspan fill="#3fb950">🌿</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#8b949e">
      Zero-config, Git-native local database branching.
    </text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#c9d1d9">
      Never drop or rebuild your local database on branch switch again.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 240)">
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
        <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#7ee787">🐘 PostgreSQL</text>
      </g>
      <g transform="translate(195, 0)">
        <rect width="160" height="42" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
        <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#79c0ff">🐬 MySQL</text>
      </g>
      <g transform="translate(370, 0)">
        <rect width="150" height="42" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
        <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#d2a8ff">🪶 SQLite</text>
      </g>
      <g transform="translate(535, 0)">
        <rect width="120" height="42" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
        <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffa657">🚀 Go</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar: GitHub URL -->
  <g transform="translate(520, 490)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#8b949e">
      github.com/oscarbol09/branchbase
    </text>
  </g>
</svg>
