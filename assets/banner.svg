<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c9d1d9" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bannerBg)" stroke="#30363d" stroke-width="2" />

  <!-- Subtle Decorative Grid Lines -->
  <g stroke="#21262d" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1100" y1="0" x2="1100" y2="320" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <!-- Left Icon Emblem -->
  <g transform="translate(60, 45)">
    <rect width="230" height="230" rx="46" fill="#161b22" stroke="#30363d" stroke-width="2" filter="url(#cardGlow)" />
    
    <!-- Database Base -->
    <g transform="translate(45, 55)">
      <!-- Main DB -->
      <path d="M0,70 C0,62 18,55 40,55 C62,55 80,62 80,70 L80,90 C80,98 62,105 40,105 C18,105 0,98 0,90 Z" fill="#21262d" stroke="#58a6ff" stroke-width="2.5" />
      <ellipse cx="40" cy="70" rx="40" ry="12" fill="#30363d" stroke="#58a6ff" stroke-width="2.5" />

      <path d="M0,35 C0,27 18,20 40,20 C62,20 80,27 80,35 L80,55 C80,63 62,70 40,70 C18,70 0,63 0,55 Z" fill="#21262d" stroke="#58a6ff" stroke-width="2.5" />
      <ellipse cx="40" cy="35" rx="40" ry="12" fill="#30363d" stroke="#58a6ff" stroke-width="2.5" />

      <path d="M0,0 C0,-8 18,-15 40,-15 C62,-15 80,-8 80,0 L80,20 C80,28 62,35 40,35 C18,35 0,28 0,20 Z" fill="#21262d" stroke="#58a6ff" stroke-width="2.5" />
      <ellipse cx="40" cy="0" rx="40" ry="12" fill="#1f6feb" fill-opacity="0.5" stroke="#58a6ff" stroke-width="2.5" />

      <!-- Branch curve -->
      <path d="M40,80 C70,80 95,55 95,20" fill="none" stroke="#3fb950" stroke-width="4" stroke-linecap="round" />
      
      <!-- Ephemeral Node -->
      <g transform="translate(80, -5)">
        <path d="M0,10 C0,5 12,0 25,0 C38,0 50,5 50,10 L50,25 C50,30 38,35 25,35 C12,35 0,30 0,25 Z" fill="#1c2d22" stroke="#3fb950" stroke-width="2" />
        <ellipse cx="25" cy="10" rx="25" ry="8" fill="#2ea043" fill-opacity="0.6" stroke="#3fb950" stroke-width="2" />
        <!-- Leaf -->
        <path d="M25,-2 C35,-14 45,-6 40,4 C36,12 25,12 25,-2 Z" fill="url(#greenGrad)" />
      </g>
    </g>
  </g>

  <!-- Typography & Copy -->
  <g transform="translate(330, 80)">
    <!-- Badge -->
    <g transform="translate(0, 0)">
      <rect width="180" height="26" rx="13" fill="#1f6feb" fill-opacity="0.15" stroke="#388bfd" stroke-width="1.2" />
      <circle cx="14" cy="13" r="5" fill="#3fb950" />
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#58a6ff" letter-spacing="0.5">LOCAL-FIRST TOOLING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
      BranchBase <tspan fill="#3fb950">🌿</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#8b949e">
      Zero-config, Git-native database branching for <tspan fill="#ffffff" font-weight="600">PostgreSQL</tspan>, <tspan fill="#ffffff" font-weight="600">MySQL</tspan> &amp; <tspan fill="#ffffff" font-weight="600">SQLite</tspan>.
    </text>

    <!-- Punchline Tags -->
    <g transform="translate(0, 140)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="30" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#7ee787">⚡ Instant Snapshots</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(175, 0)">
        <rect width="175" height="30" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#79c0ff">🔌 Transparent Proxy</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(360, 0)">
        <rect width="160" height="30" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#d2a8ff">📴 100% Local-First</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(530, 0)">
        <rect width="150" height="30" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#ffa657">🐳 Docker Compose</text>
      </g>
    </g>
  </g>
</svg>
