<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="80" fill="url(#bgGrad)" />
  <rect width="396" height="396" x="2" y="2" rx="78" fill="none" stroke="#30363d" stroke-width="2" />

  <!-- Database Cylinders on the left (Main Trunk) -->
  <g transform="translate(100, 110)">
    <!-- Base Cylinder 3 -->
    <path d="M0,130 C0,118 35,108 80,108 C125,108 160,118 160,130 L160,160 C160,172 125,182 80,182 C35,182 0,172 0,160 Z" fill="url(#dbGrad)" stroke="#58a6ff" stroke-width="3" />
    <ellipse cx="80" cy="130" rx="80" ry="22" fill="#30363d" stroke="#58a6ff" stroke-width="3" />

    <!-- Base Cylinder 2 -->
    <path d="M0,70 C0,58 35,48 80,48 C125,48 160,58 160,70 L160,100 C160,112 125,122 80,122 C35,122 0,112 0,100 Z" fill="url(#dbGrad)" stroke="#58a6ff" stroke-width="3" />
    <ellipse cx="80" cy="70" rx="80" ry="22" fill="#30363d" stroke="#58a6ff" stroke-width="3" />

    <!-- Top Cylinder 1 -->
    <path d="M0,10 C0,-2 35,-12 80,-12 C125,-12 160,-2 160,10 L160,40 C160,52 125,62 80,62 C35,62 0,52 0,40 Z" fill="url(#dbGrad)" stroke="#58a6ff" stroke-width="3" />
    <ellipse cx="80" cy="10" rx="80" ry="22" fill="#388bfd" fill-opacity="0.3" stroke="#58a6ff" stroke-width="3" filter="url(#glow)" />
  </g>

  <!-- Git Branching Connection Paths -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Main branch line -->
    <path d="M180, 240 L180, 120" stroke="#58a6ff" stroke-width="6" stroke-dasharray="6,6" />
    <!-- Branch-out curve to the right -->
    <path d="M180, 220 C230, 220 270, 180 270, 120" fill="none" stroke="#3fb950" stroke-width="6" />
  </g>

  <!-- Branch Database (Right Node - Ephemeral Branch) -->
  <g transform="translate(230, 75)">
    <path d="M0,20 C0,12 18,5 40,5 C62,5 80,12 80,20 L80,45 C80,53 62,60 40,60 C18,60 0,53 0,45 Z" fill="#1c2d22" stroke="#3fb950" stroke-width="3" />
    <ellipse cx="40" cy="20" rx="40" ry="15" fill="#2ea043" fill-opacity="0.4" stroke="#3fb950" stroke-width="3" filter="url(#glow)" />
    <!-- Leaf indicator -->
    <path d="M40,5 C55,-15 70,-5 65,10 C60,20 40,22 40,5 Z" fill="url(#leafGrad)" />
  </g>

  <!-- Git Nodes / Pulse Dots -->
  <circle cx="180" cy="220" r="10" fill="#58a6ff" stroke="#0d1117" stroke-width="3" />
  <circle cx="180" cy="120" r="8" fill="#58a6ff" stroke="#0d1117" stroke-width="3" />
  <circle cx="270" cy="120" r="10" fill="#3fb950" stroke="#0d1117" stroke-width="3" />
</svg>
